sonar.projectKey=IreneCitas
sonar.projectName=IreneCitas

# El servidor se indica al ejecutar el escaner (en GitLab lo pone el pipeline;
# en local: -Dsonar.host.url=http://localhost:9000).
#
# Se analiza todo el codigo del proyecto sin excluir carpetas. vendor/ y
# node_modules/ no se suben al repositorio (.gitignore).
sonar.sources=app,bootstrap,config,database,lang,public,resources,routes
sonar.tests=tests

# Reportes de PHPUnit. Se generan antes de escanear con:
#   composer test:sonar
# que ademas deja las rutas relativas para que sirvan en cualquier maquina.
# La cobertura se mide sobre app/, database/ y routes/ (ver <source> en phpunit.xml).
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml

sonar.sourceEncoding=UTF-8
