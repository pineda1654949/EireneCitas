sonar.projectKey=IreneCitas
sonar.projectName=IreneCitas
sonar.host.url=http://localhost:9000

# Solo se analiza el codigo propio. config/, lang/, bootstrap/ y public/ son
# archivos generados o publicados por Laravel y no se modifican.
sonar.sources=app,database,resources,routes
sonar.tests=tests

sonar.exclusions=**/node_modules/**,**/vendor/**,**/storage/**,**/.phpunit.cache/**,**/build/**

sonar.test.exclusions=**/node_modules/**,**/vendor/**

# Reportes de PHPUnit. Se generan antes de escanear con:
#   composer test:sonar
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml

# PHPUnit mide la cobertura solo sobre app/ (ver <source> en phpunit.xml).
# Vistas, JS, rutas, migraciones, seeders y factories se prueban con Dusk y
# las pruebas de integracion, pero no generan lineas en clover.xml.
sonar.coverage.exclusions=database/**,resources/**,routes/**

sonar.sourceEncoding=UTF-8
