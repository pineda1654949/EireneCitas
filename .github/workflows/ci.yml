# Integracion continua: en cada push y pull request se verifica la calidad
# del codigo (estilo, analisis estatico), se ejecuta la suite de pruebas con
# cobertura (SQLite y MySQL) y se compila el frontend.
name: CI

on:
  push:
    branches: [main, migracion-laravel-12]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Estilo y analisis estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo de codigo (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Analisis estatico (PHPStan / Larastan nivel 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Auditoria de seguridad de dependencias PHP
        run: composer audit

  pruebas:
    name: Pruebas (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, zip
          coverage: pcov

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ejecutar pruebas con cobertura
        run: vendor/bin/phpunit --coverage-text --coverage-clover=build/logs/clover.xml --coverage-html=build/cobertura

      - name: Publicar reporte de cobertura
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: build/cobertura

  pruebas-mysql:
    name: Pruebas con MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eirene_pruebas
          MYSQL_ROOT_PASSWORD: secreto
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecreto"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eirene_pruebas
      DB_USERNAME: root
      DB_PASSWORD: secreto
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migraciones de ida y vuelta (up / down / up)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed

      - name: Ejecutar pruebas contra MySQL
        run: |
          vendor/bin/phpunit \
            --do-not-cache-result \
            -d memory_limit=1G
        env:
          # phpunit.xml fija SQLite; se sobrescribe para usar MySQL
          DB_CONNECTION: mysql
          DB_DATABASE: eirene_pruebas

  frontend:
    name: Compilacion del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
